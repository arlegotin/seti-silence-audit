[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seti-silence-audit"
version = "0.1.0"
description = "Reproducible finite-target audit of a radio null and physical arrival"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "matplotlib", "pytest", "mpmath"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
